[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "documentation-engine"
dynamic = ["version"]
description = "Provider-neutral structured Markdown documentation engine."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Oleg Synelnykov (Jafa7)" },
]
requires-python = ">=3.12"
dependencies = [
    "PyYAML>=6,<7",
]

[project.urls]
Repository = "https://github.com/Jafa7/DocumentationEngine"
Documentation = "https://github.com/Jafa7/DocumentationEngine/tree/main/docs"
Issues = "https://github.com/Jafa7/DocumentationEngine/issues"
Changelog = "https://github.com/Jafa7/DocumentationEngine/blob/main/CHANGELOG.md"

[project.optional-dependencies]
mcp = ["mcp>=1.2,<2"]

[project.scripts]
docsystem = "docsystem.cli:main"
docsystem-mcp = "docsystem.mcp_server:main"

[dependency-groups]
dev = [
    "mcp>=1.2,<2",
    "pytest>=9,<10",
    "ruff>=0.14,<1",
]

[tool.hatch.version]
path = "src/docsystem/__init__.py"

[tool.hatch.build]
# Distribution artifacts are a public trust boundary. Hidden workspace state
# and conventionally local files must never be selected by either build target.
exclude = [
    "**/.*",
    "**/*.local.*",
]

[tool.hatch.build.targets.wheel]
packages = ["src/docsystem"]

[tool.hatch.build.targets.sdist]
# Traverse only public source inputs. Hatchling's default is every file not
# ignored by VCS, which is unsafe when an adopter keeps local agent/runtime
# state beside the checkout.
only-include = [
    ".gitignore",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "LICENSE",
    "README.md",
    "SECURITY.md",
    "docs",
    "examples",
    "pyproject.toml",
    "scripts",
    "src",
    "tests",
    "uv.lock",
]

[tool.hatch.build.targets.sdist.force-include]
# These are authored public examples, not project-local configuration.
"examples/generic-adopter/.docsystem.toml" = "examples/generic-adopter/.docsystem.toml"
"examples/provider-snapshots/.docsystem.toml" = "examples/provider-snapshots/.docsystem.toml"

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
